<div class="p-4 max-w-5xl mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2x1 font-semibold text-gray-700 mb-4 text-center">Lugares</h2>
    <hr />

    <div class="overflow-x-auto rounded-lg shadow-md">
        <table class="w-[950px] mx-auto divide-y divide-gray-200">
            <thead class="bg-blue-600">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Nome
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Categoria
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Localização
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Avaliação
                </th>
                <th class="px-6 py-3 text-center text-xs font-medium uppercase tracking-wider text-white">
                Ações
                </th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-200 bg-white">
                <tr class="hover:bg-gray-100" *ngFor="let lugar of lugares">
                    <td class="px-6 py-4">{{ lugar.nome }}</td>
                    <td class="px-6 py-4">{{ buscarNomeCategoria(lugar.categoriaId) }}</td>
                    <td class="px-6 py-4 max-w-xs truncate">{{ lugar.localizacao }}</td>                    
                    <td class="px-6 py-4">{{ lugar.avaliacao }}</td>
                    <td class="px-6 py-4 text-center">
                    <button *ngIf="authService.verificaPermissao('lugares.editar')" 
                        [routerLink]="['/paginas/lugares/editar', lugar.id]"
                        class="mr-2 rounded bg-blue-600 px-3 py-1 text-sm font-semibold text-white hover:bg-blue-700">
                        Editar
                    </button>

                    <button *ngIf="authService.verificaPermissao('lugares.excluir')" 
                        (click)="excluirLugar(lugar.id)"
                        class="rounded bg-red-600 px-3 py-1 text-sm font-semibold text-white hover:bg-red-700">
                        Excluir
                    </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="flex justify-center mt-8 gap-2">
            <button (click)="paginaAnterior()" [disabled]="paginaAtual === 1" class="px-4 py-2 bg-blue-600 text-white rounded">Anterior</button>
            
            <span class="px-4 py-2">Página {{ paginaAtual }} de {{ totalPaginas }}</span>
            
            <button (click)="proximaPagina()" [disabled]="paginaAtual === totalPaginas" class="px-4 py-2 bg-blue-600 text-white rounded">Próxima</button>
        </div>

        <!-- <a routerLink="/categorias/cadastro" class="inline-block mt-4 ml-4 rounded bg-blue-600  px-3 pu-2 text-sm font-semibold text-white hover:bg-blue-700"></a> -->
        <button
        *ngIf="authService.verificaPermissao('lugares.criar')"
            routerLink="/paginas/lugares/cadastro"
            class="mt-4 ml-4 mb-4 rounded bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-700">
            Cadastrar
        </button>
        
    </div>

</div>
