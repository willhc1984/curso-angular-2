<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2x1 font-semibold text-gray-700 mb-4">Cadastro de Papéis</h2>
    <hr />

    <form [formGroup]="camposForm">
        <div class="mb-4">
            <label for="nome" class="block text-gray-600 font-medium mb-2">Nome</label>
            <input type="text" id="nome" name="nome" formControlName="nome" placeholder="Ex: editor, administrador, operador..." 
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring-blue-400"
                required />
                <span class="text-red-500 text-sm">
                    Campo obrigatório
                </span>
        </div>
        <div class="mb-4">
            <label for="descricao" class="block text-gray-600 font-medium mb-2">Descrição</label>
            <input type="text" id="nome" name="nome" formControlName="descricao" placeholder="Ex: exclui, edita, cria..." 
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring-blue-400"
                required />
                <span class="text-red-500 text-sm">
                    Campo obrigatório
                </span>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-4">
                Permissões
            </h2>
            <div formArrayName="permissoes" class="space-y-3">
                <div class="flex items-center" *ngFor="let permissao of permissoes; let i = index">
                    <input 
                        [id]="'permissao' + 1"
                        type="checkbox"
                        [formControlName]="i"
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                    <label [for]="'permissao' + i" class="ml-2">
                        {{ permissao.grupo }} - {{ permissao.descricao }}
                    </label>
                </div>
            </div>       
        </div>

        <button 
            type="button" class="w-full bg-blue-600 font-semibold p-3 text-white rounded shadow hover:bg-blue-700">
            Salvar
        </button>
    </form>
</div>
