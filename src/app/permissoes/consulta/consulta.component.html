<div class="p-4 max-w-4xl mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2x1 font-semibold text-gray-700 mb-4 text-center">Permissões</h2>
    <hr />

    <div class="overflow-x-auto rounded-lg shadow-md">
        <table class="w-[850px] mx-auto divide-y divide-gray-200">
            <thead class="bg-blue-600">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                ID
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Código
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-white">
                Descrição
                </th>
                <th class="px-6 py-3 text-center text-xs font-medium uppercase tracking-wider text-white">
                Ações
                </th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-200 bg-white">
                <tr class="hover:bg-gray-100" *ngFor="let permissao of permissoes">
                    <td class="px-6 py-4">{{ permissao.id }}</td>
                    <td class="px-6 py-4">{{ permissao.codigo }}</td>
                    <td class="px-6 py-4">{{ permissao.descricao }}</td>
                    <td class="px-6 py-4 text-center">
                    <button 
                        [routerLink]="['/paginas/permissoes/editar', permissao.id]"
                        class="mr-2 rounded bg-blue-600 px-3 py-1 text-sm font-semibold text-white hover:bg-blue-700">
                        Editar
                    </button>

                    <button (click)="excluirPermissao(permissao.id)"
                        class="rounded bg-red-600 px-3 py-1 text-sm font-semibold text-white hover:bg-red-700">
                        Excluir
                    </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Paginação-->
        <div class="flex justify-center mt-8 gap-2">
            <button class="px-4 py-2 bg-blue-600 text-white rounded">Anterior</button>
            <span class="px-4 py-2">Página</span>            
            <button class="px-4 py-2 bg-blue-600 text-white rounded">Próxima</button>
        </div>

        <!-- <a routerLink="/categorias/cadastro" class="inline-block mt-4 ml-4 rounded bg-blue-600  px-3 pu-2 text-sm font-semibold text-white hover:bg-blue-700"></a> -->
        <button 
            routerLink="/paginas/permissoes/cadastro"
            class="mt-4 ml-4 mb-4 rounded bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-700">
            Cadastrar
        </button>
        
    </div>

</div>
